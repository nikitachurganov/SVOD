# Bootstrap HTTP config — use before SSL certificate is issued.
# Mount as /etc/nginx/conf.d/default.conf in the edge nginx container.
#
# After certbot:
#   switch to app.svodservice.ru.conf

upstream svod_frontend {
    server frontend:80;
}

upstream svod_api {
    server api:8000;
}

server {
    listen 80;
    server_name app.svodservice.ru;

    client_max_body_size 25m;

    # Certbot webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://svod_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://svod_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
