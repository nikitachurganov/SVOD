# Production HTTPS config for app.svodservice.ru
# Requires Let's Encrypt certificates mounted at /etc/letsencrypt

upstream svod_frontend {
    server frontend:80;
}

upstream svod_api {
    server api:8000;
}

server {
    listen 80;
    server_name app.svodservice.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name app.svodservice.ru;

    ssl_certificate /etc/letsencrypt/live/app.svodservice.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.svodservice.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SVOD_SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://svod_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://svod_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
